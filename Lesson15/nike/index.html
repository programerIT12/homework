<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <script type="module" defer src="../nike/js/index.js"></script>
    <link
      rel="shortcut icon"
      href="./icons/nike-favicon-48x48.ico"
      type="image/x-icon"
    />
    <title>Nike Air Mag</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a href="" class="logo header__logo"
          ><img
            height="20px"
            width="50px"
            src="../nike/icons/header__logo.svg"
            alt="Логотип Nike"
        /></a>
        <nav
          class="menu header__menu"
          id="header__menu"
          aria-label="Главное меню"
        >
          <ul class="menu__list">
            <li class="menu__iteam">
              <a href="#air-mag" class="menu__link" lang="en ">Air Mag</a>
            </li>
            <li class="menu__iteam">
              <a href="#sizes" class="menu__link">Размеры</a>
            </li>
            <li class="menu__iteam">
              <a href="#characters" class="menu__link">Характеристики</a>
            </li>
            <li class="menu__iteam">
              <a href="#top-models" class="menu__link">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <a href="#" class="header__order">Сделать заказ</a>
          <div class="header__actions">
            <button
              class="header__actions-button"
              title="Поиск"
              area-lavel="Поиск"
            >
              <svg width="24px" height="24px">
                <use
                  class="header__actions-icon"
                  href="../nike/icons/sprite.svg#search"
                ></use>
                >
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Корзина"
              area-lavel="Корзина"
            >
              <svg width="24px" height="24px">
                <use
                  class="header__actions-icon"
                  href="../nike/icons/sprite.svg#cart"
                ></use>
                >
              </svg>
            </button>
            <button
              class="header__burger burger"
              area-label="Открыть меню"
              aria-expanded="false"
              aria-controls="header__menu"
            >
              <svg width="24px" height="24px">
                <use
                  class="burger__icon-menu"
                  href="../nike/icons/sprite.svg#burger-menu"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="../nike/icons/sprite.svg#burger-cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
