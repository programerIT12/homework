<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <script type="module" src="./js/index.js"></script>
    <link
      rel="shortcut icon"
      href="./icons/nike-favicon-48x48.ico"
      type="image/x-icon"
    />
    <title>Nike Air Mag</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a href="" class="logo header__logo"
          ><img
            height="20px"
            width="50px"
            src="./icons/header__logo.svg"
            alt="Логотип Nike"
        /></a>
        <nav
          class="menu header__menu"
          id="header__menu"
          aria-label="Главное меню"
        >
          <ul class="menu__list">
            <li class="menu__iteam">
              <a href="#air-mag" class="menu__link" lang="en ">Air Mag</a>
            </li>
            <li class="menu__iteam">
              <a href="#sizes" class="menu__link">Размеры</a>
            </li>
            <li class="menu__iteam">
              <a href="#characters" class="menu__link">Характеристики</a>
            </li>
            <li class="menu__iteam">
              <a href="#top-models" class="menu__link">Другие ТОП модели</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <a href="#" class="header__order">Сделать заказ</a>
          <div class="header__actions">
            <button
              class="header__actions-button"
              title="Поиск"
              area-lavel="Поиск"
            >
              <svg width="24px" height="24px">
                <use
                  class="header__actions-icon"
                  href="./icons/sprite.svg#search"
                ></use>
                >
              </svg>
            </button>
            <button
              class="header__actions-button"
              title="Корзина"
              area-lavel="Корзина"
            >
              <svg width="24px" height="24px">
                <use
                  class="header__actions-icon"
                  href="./icons/sprite.svg#cart"
                ></use>
                >
              </svg>
            </button>
            <button
              class="header__burger burger"
              area-label="Открыть меню"
              aria-expanded="false"
              aria-controls="header__menu"
            >
              <svg width="24px" height="24px">
                <use
                  class="burger__icon-menu"
                  href="./icons/sprite.svg#burger-menu"
                ></use>
                <use
                  class="burger__icon-cross"
                  href="./icons/sprite.svg#burger-cross"
                ></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="hero">
        <div class="container hero__container">
          <header class="hero__header">
            <ul class="hero__benefits-list">
              <li class="hero__benefits-item">Стиль</li>
              <li class="hero__benefits-item">Скорость</li>
            </ul>
            <h1 class="hero__title">
              Nike <span class="hero__title-accente"> air</span> mag
            </h1>
          </header>
          <img
            class="hero__img"
            width="846px"
            height="713px"
            src="./img/Hero__img.png"
            alt="Кроссовок Nike Air Mag "
          />
          <footer class="hero__footer">
            <a href="#" class="hero__details"
              >Подробнее
              <svg class="hero__details-more" width="12px" height="12px">
                <use href="./icons/main_sprite.svg#more"></use>
              </svg>
            </a>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
