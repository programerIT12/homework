  <body>
    <form class="form">

        <h2>Information About you</h2>

          >Your Name<input type="text" placeholder="Name..." required
        /></label>
        <label

        /></label>

          >YourPhone Number<input
            type="tel"

            required
        /></label>
        <label
          >Your Email<input
            type="email"
            placeholder="Example@gmail.com..."
            required
        /></label>
      </fieldset>
      <fieldset class="main-form">
        <label>
          Your massage
          <textarea placeholder="Hello World..."></textarea>
        </label>
        <label
          ><input class="check" type="checkbox" required />I take all the ruless
        </label>
        <button class="btn" type="submit">Send</button>
      </fieldset>
    </form>
  </body>
